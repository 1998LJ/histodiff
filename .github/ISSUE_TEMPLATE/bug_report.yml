name: Bug report
description: Something in histodiff behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** use
        this form for a suspected security vulnerability - see
        [SECURITY.md](https://github.com/rmnvg/histodiff/blob/main/SECURITY.md)
        instead.
  - type: input
    id: version
    attributes:
      label: histodiff version
      description: >
        Output of `python -c "import histodiff; print(histodiff.__version__)"`
        or `histodiff --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in the description)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest `old`/`new` input that shows the problem - a Python
        snippet using `histodiff.diff(...)`, or two small files and the
        exact `histodiff` command you ran.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full traceback if there is one.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md if it is).
          required: true
