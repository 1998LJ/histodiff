name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside the source tree
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import importlib.metadata as m; import histodiff; assert histodiff.__version__ == m.version('histodiff')"
          histodiff --version
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, histodiff; assert os.environ['RELEASE_TAG'] == f'v{histodiff.__version__}'"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Before/after example
        run: python examples/before_after.py
      - name: Benchmark smoke test
        run: python benchmarks/bench.py --quick
      - name: CLI smoke test
        shell: bash
        run: |
          set +e
          histodiff examples/frobnitz_old.c examples/frobnitz_new.c
          status=$?
          set -e
          test "$status" -eq 1
