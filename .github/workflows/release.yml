name: Release

# Production release: push a tag matching v* (e.g. `git tag v0.2.0 && git
# push origin v0.2.0`). build-and-verify.yml's own "Verify release tag
# matches package version" step (gated on refs/tags/v*) fails the build
# before anything is published if the tag doesn't match
# src/histodiff/__init__.py's __version__.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-and-verify.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure this environment's protection rules (Settings > Environments
    # > pypi) to require a reviewer before this job runs, so pushing a tag
    # doesn't by itself publish to real PyPI without a second pair of eyes.
    # It's also where PyPI's trusted-publisher configuration expects this
    # job to run *as* - see the comment on the publish step below.
    environment:
      name: pypi
      url: https://pypi.org/project/histodiff/
    permissions:
      # id-token: write is what lets gh-action-pypi-publish get a short-lived
      # OIDC token instead of a long-lived API token stored as a secret -
      # see https://docs.pypi.org/trusted-publishers/.
      id-token: write
      # For actions/attest-build-provenance - see
      # https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
      attestations: write
      # For creating the GitHub Release below.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Requires a trusted publisher to be configured for this project on
      # PyPI first (pypi.org > your project > Publishing), pointing at this
      # repository, this workflow file, and the "pypi" environment above.
      # See https://docs.pypi.org/trusted-publishers/ for first-time setup;
      # for a project that has never been published, register it as a
      # *pending* trusted publisher before pushing the first release tag.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details. Published to PyPI: https://pypi.org/project/histodiff/${{ github.ref_name }}/"
