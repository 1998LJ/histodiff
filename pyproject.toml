[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "histodiff"
dynamic = ["version"]
description = "Human-readable diffs for code and structured text with moved, repeated, or reformatted blocks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "rmnvg" }]
keywords = ["diff", "patience", "histogram", "myers", "difflib", "text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1", "hypothesis>=6", "mypy>=1.10", "pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/rmnvg/histodiff"
Documentation = "https://github.com/rmnvg/histodiff#readme"
Changelog = "https://github.com/rmnvg/histodiff/blob/main/CHANGELOG.md"
Issues = "https://github.com/rmnvg/histodiff/issues"
Repository = "https://github.com/rmnvg/histodiff.git"

[project.scripts]
histodiff = "histodiff.cli:main"
git-histodiff = "histodiff._git:main"

[tool.hatch.version]
path = "src/histodiff/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/histodiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
