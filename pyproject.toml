[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "histodiff"
version = "0.1.0"
description = "Alignment-aware diffing for Python using patience and histogram algorithms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "rmnvg" }]
keywords = ["diff", "patience", "histogram", "myers", "difflib", "text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10", "pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/rmnvg/histodiff"
Issues = "https://github.com/rmnvg/histodiff/issues"
Repository = "https://github.com/rmnvg/histodiff.git"

[project.scripts]
histodiff = "histodiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/histodiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
